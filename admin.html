<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>候補者管理｜好き顔9選</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f7f7f7;color:#222}
main{max-width:760px;margin:auto;padding:18px 12px 48px}
h1{font-size:26px;margin:8px 0}h2{font-size:20px;margin:28px 0 12px}
.muted{color:#666;font-size:14px;line-height:1.6}
.notice{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:14px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:700;background:#222;color:#fff}
button.secondary{background:#e9e9e9;color:#222}
button.danger{background:#b00020}
.slot{background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px;margin:10px 0}
.slot-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:8px}
.row{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center}
.preview{width:92px;height:92px;object-fit:cover;border-radius:10px;background:#eee}
input[type=text]{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font-size:16px;margin-bottom:8px}
input[type=file]{width:100%;font-size:13px;margin-top:8px}
.actions{position:sticky;bottom:0;background:rgba(247,247,247,.96);padding:10px 0;display:flex;gap:8px}
.actions button{flex:1}
a{color:#333}
small{color:#777}
</style>
</head>
<body>
<main>
<h1>候補者管理</h1>
<p class="muted">100人分の名前と写真を登録できます。ここで保存した内容は、このiPhoneのこのブラウザで「好き顔9選」に反映されます。</p>
<div class="notice">
<strong>重要：</strong>この管理画面はサーバーに候補者データを保存しません。写真と名前はこのブラウザ内に保存されます。別の端末にも同じデータを公開したい場合は、下の「書き出す」でデータをファイル化できます。
</div>

<div class="toolbar">
<button onclick="saveAll()">この内容を保存</button>
<button class="secondary" onclick="exportData()">データを書き出す</button>
<button class="secondary" onclick="document.getElementById('importFile').click()">データを読み込む</button>
<input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)">
</div>

<div id="slots"></div>

<div class="actions">
<button class="secondary" onclick="location.href='index.html'">好き顔9選へ戻る</button>
<button onclick="saveAll()">保存する</button>
</div>
</main>

<script>
const KEY='sukigao9_candidates';
const defaults=Array.from({length:100},(_,i)=>({
  id:i+1,
  group:'', name:`候補者 ${String(i+1).padStart(3,'0')}`,
  image:`https://picsum.photos/seed/sukigao${i+1}/500/500`
}));
let data=load();

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return structuredClone(defaults);
    const x=JSON.parse(raw);
    if(!Array.isArray(x)||x.length!==100)return structuredClone(defaults);
    return x;
  }catch(e){return structuredClone(defaults)}
}
function render(){
  document.getElementById('slots').innerHTML=data.map((c,i)=>`
    <div class="slot">
      <div class="slot-head"><span>${i+1}人目</span><small id="status-${i}"></small></div>
      <div class="row">
        <img class="preview" id="preview-${i}" src="${c.image}" alt="">
        <div>
          <input type="text" id="group-${i}" value="${escapeAttr(c.group||"")}" placeholder="コンビ名（小さく表示）">
          <input type="text" id="name-${i}" value="${escapeAttr(c.name)}" placeholder="個人名（大きく表示）">
          <input type="file" accept="image/*" onchange="pickImage(${i},event)">
        </div>
      </div>
    </div>
  `).join('');
}
function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function pickImage(i,e){
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>compressImage(reader.result).then(src=>{
    data[i].image=src;
    document.getElementById('preview-'+i).src=src;
    document.getElementById('status-'+i).textContent='写真変更済み';
  });
  reader.readAsDataURL(file);
}
function compressImage(src){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const max=700, scale=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*scale));
      c.height=Math.max(1,Math.round(img.height*scale));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL('image/jpeg',0.82));
    };
    img.src=src;
  });
}
function syncNames(){
  data.forEach((c,i)=>{
    const el=document.getElementById('name-'+i);
    if(el)const g=document.getElementById('group-'+i); c.group=g?g.value.trim():''; c.name=el.value.trim()||`候補者 ${String(i+1).padStart(3,'0')}`;
  });
}
function saveAll(){
  syncNames();
  try{
    localStorage.setItem(KEY,JSON.stringify(data));
    alert('保存しました。好き顔9選を開くと反映されます。');
  }catch(e){
    alert('保存できませんでした。写真の容量が大きすぎる可能性があります。写真を少なくするか、画像サイズを小さくしてください。');
  }
}
function exportData(){
  syncNames();
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='sukigao9_candidates.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(e){
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const x=JSON.parse(reader.result);
      if(!Array.isArray(x)||x.length!==100)throw new Error();
      data=x.map((c,i)=>({id:i+1,group:c.group||'',name:c.name||`候補者 ${String(i+1).padStart(3,'0')}`,image:c.image||defaults[i].image}));
      render();
      alert('読み込みました。内容を確認して「この内容を保存」を押してください。');
    }catch(err){alert('正しい好き顔9選のデータファイルではありません。')}
  };
  reader.readAsText(file);
}
render();
</script>
</body>
</html>
