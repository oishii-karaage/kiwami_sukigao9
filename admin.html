<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>極 好き顔9選 — グループ編集</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:20;background:#111;color:#fff;padding:14px 16px;box-shadow:0 2px 10px #0002}
h1{font-size:18px;margin:0 0 5px}
.sub{font-size:12px;opacity:.75}
.wrap{max-width:1100px;margin:auto;padding:14px}
.notice{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;margin-bottom:12px;font-size:13px;line-height:1.6}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button,input,select{font:inherit}
button{border:0;border-radius:9px;padding:9px 12px;background:#222;color:#fff;cursor:pointer}
button.secondary{background:#fff;color:#222;border:1px solid #ccc}
button.danger{background:#b42318}
button:disabled{opacity:.45;cursor:default}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.tab{background:#fff;color:#222;border:1px solid #ddd;padding:8px 4px;font-size:12px}
.tab.active{background:#222;color:#fff;border-color:#222}
.panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;margin-bottom:12px}
.panel h2{font-size:16px;margin:0 0 10px}
.search{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;margin-bottom:10px}
.groupgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{border:1px dashed #bbb;border-radius:10px;padding:7px;min-height:170px;position:relative}
.slot .num{font-size:11px;color:#777;margin-bottom:5px}
.card{position:relative}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;display:block;background:#eee}
.card .name{font-size:13px;font-weight:700;margin-top:5px;line-height:1.25}
.card .group{font-size:11px;color:#777;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot select{width:100%;margin-top:7px;padding:7px;border:1px solid #ccc;border-radius:7px;background:#fff}
.allgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.person{background:#fff;border:1px solid #ddd;border-radius:9px;padding:6px}
.person img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px}
.person .name{font-size:11px;font-weight:700;margin-top:4px;line-height:1.25}
.person .meta{font-size:10px;color:#777;margin-top:2px}
.person select{width:100%;font-size:11px;margin-top:5px;padding:5px;border:1px solid #ccc;border-radius:6px}
.status{font-size:13px;font-weight:700;margin-left:auto;align-self:center}
.ok{color:#18794e}.bad{color:#b42318}
@media(max-width:700px){
  .groupgrid{grid-template-columns:repeat(2,1fr)}
  .allgrid{grid-template-columns:repeat(3,1fr)}
  .tabs{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>
<header>
  <h1>よしもと漫才劇場 極 好き顔9選 — グループ編集</h1>
  <div class="sub">予選25グループのメンバーを編集します</div>
</header>

<div class="wrap">
  <div class="notice">
    <b>編集対象：</b>予選の25グループ（各4人）。<br>
    「保存」を押すと、このブラウザの <code>sukigao9_prelim_groups</code> に保存され、同じ端末の本編でそのグループ分けが使われます。
    <br>現在の <code>data.js</code> に入っている100人・25グループを初期値として読み込んでいます。
  </div>

  <div class="toolbar">
    <button onclick="saveGroups()">変更を保存</button>
    <button class="secondary" onclick="resetGroups()">data.jsの初期グループに戻す</button>
    <button class="secondary" onclick="exportDataJs()">data.jsとして書き出す</button>
    <button class="secondary" onclick="exportJson()">JSONを書き出す</button>
    <button class="secondary" onclick="importJson()">JSONを読み込む</button>
    <input id="fileInput" type="file" accept=".json,application/json" hidden>
    <span id="status" class="status"></span>
  </div>

  <div class="panel">
    <h2 id="groupTitle">グループ1</h2>
    <div id="tabs" class="tabs"></div>
    <div id="groupGrid" class="groupgrid"></div>
  </div>

  <div class="panel">
    <h2>全100人から選ぶ</h2>
    <input id="search" class="search" placeholder="名前・所属で検索">
    <div id="allGrid" class="allgrid"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
"use strict";

const BASE = window.SUKIGAO9_DATA;
if(!BASE || !Array.isArray(BASE.candidates) || BASE.candidates.length !== 100 ||
   !Array.isArray(BASE.prelimGroups) || BASE.prelimGroups.length !== 25){
  document.body.innerHTML = '<div style="padding:20px;font-family:sans-serif"><b>data.jsを読み込めません。</b><br>admin.htmlとdata.jsを同じ場所に置いてください。</div>';
  throw new Error("Invalid data.js");
}

const candidates = BASE.candidates.map(c => ({
  id:Number(c.id), group:String(c.group||""), name:String(c.name||""), image:String(c.image||"")
}));
const byId = new Map(candidates.map(c => [c.id,c]));
const INITIAL_GROUPS = BASE.prelimGroups.map(g => g.map(Number));
const STORAGE_KEY = "sukigao9_prelim_groups";

let groups = loadGroups();
let current = 0;

function validGroups(x){
  if(!Array.isArray(x) || x.length!==25) return false;
  if(x.some(g => !Array.isArray(g) || g.length!==4)) return false;
  const ids=x.flat().map(Number);
  return ids.length===100 && new Set(ids).size===100 && ids.every(id=>byId.has(id));
}

function cloneGroups(x){ return x.map(g=>g.slice()); }

function loadGroups(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const x=JSON.parse(raw);
      if(validGroups(x)) return x.map(g=>g.map(Number));
    }
  }catch(e){}
  return cloneGroups(INITIAL_GROUPS);
}

function setStatus(msg, ok=true){
  const el=document.getElementById("status");
  el.textContent=msg;
  el.className="status "+(ok?"ok":"bad");
  clearTimeout(setStatus.t);
  setStatus.t=setTimeout(()=>{el.textContent="";},3000);
}

function renderTabs(){
  const tabs=document.getElementById("tabs");
  tabs.innerHTML=groups.map((g,i)=>
    `<button class="tab ${i===current?"active":""}" onclick="selectGroup(${i})">組${i+1}<br><small>${g.length}/4</small></button>`
  ).join("");
}

function renderGroup(){
  document.getElementById("groupTitle").textContent=`グループ${current+1}`;
  const grid=document.getElementById("groupGrid");
  grid.innerHTML=groups[current].map((id,i)=>{
    const c=byId.get(id);
    return `<div class="slot">
      <div class="num">${i+1}人目</div>
      <div class="card">
        <img src="${c.image}" alt="">
        <div class="name">${esc(c.name)}</div>
        <div class="group">${esc(c.group)}</div>
      </div>
      <select onchange="moveSlot(${i},this.value)">
        <option value="">この人を別グループへ</option>
        ${groups.map((_,gi)=>gi).filter(gi=>gi!==current)
          .map(gi=>`<option value="${gi}">グループ${gi+1}へ</option>`).join("")}
      </select>
      <button class="danger" style="width:100%;margin-top:6px;padding:7px" onclick="removeFromGroup(${i})">外す</button>
    </div>`;
  }).join("");
  renderTabs();
}

function renderAll(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const currentSet=new Set(groups[current]);
  const arr=candidates.filter(c=>{
    if(!q) return true;
    return c.name.toLowerCase().includes(q) || c.group.toLowerCase().includes(q);
  });
  document.getElementById("allGrid").innerHTML=arr.map(c=>{
    const gi=groups.findIndex(g=>g.includes(c.id));
    return `<div class="person">
      <img src="${c.image}" alt="">
      <div class="name">${esc(c.name)}</div>
      <div class="meta">${esc(c.group)} / 現在: ${gi<0?"未配置":"組"+(gi+1)}</div>
      <select onchange="movePerson(${c.id},this.value)">
        <option value="">移動先を選択</option>
        ${groups.map((_,i)=>`<option value="${i}" ${i===gi?"disabled":""}>組${i+1}${i===gi?"（現在）":""}</option>`).join("")}
      </select>
    </div>`;
  }).join("");
}

function render(){
  renderGroup();
  renderAll();
}

function selectGroup(i){ current=i; render(); }

function moveSlot(slotIndex,targetValue){
  if(targetValue==="") return;
  const target=Number(targetValue);
  if(groups[target].length>=4){ setStatus("移動先が4人なので移動できません",false); render(); return; }
  const [id]=groups[current].splice(slotIndex,1);
  groups[target].push(id);
  render();
}

function removeFromGroup(slotIndex){
  if(groups[current].length<=1){setStatus("空のグループにはできません",false);return;}
  const id=groups[current][slotIndex];
  // 外すだけでは100人を維持できないため、削除ではなく未配置扱いにしない。
  // 代わりに、現在グループから外したい場合は他グループへの移動を使う。
  setStatus(`${byId.get(id).name}は「別グループへ」で移動してください`,false);
}

function movePerson(id,targetValue){
  if(targetValue==="") return;
  const target=Number(targetValue);
  const from=groups.findIndex(g=>g.includes(id));
  if(from<0){setStatus("所属グループが見つかりません",false);return;}
  if(from===target){render();return;}
  if(groups[target].length>=4){setStatus("移動先が4人なので移動できません",false);render();return;}
  groups[from]=groups[from].filter(x=>x!==id);
  groups[target].push(id);
  render();
}

function saveGroups(){
  if(!validGroups(groups)){setStatus("25グループ・各4人・重複なしにしてください",false);return;}
  localStorage.setItem(STORAGE_KEY,JSON.stringify(groups));
  setStatus("保存しました");
}

function resetGroups(){
  if(!confirm("data.jsの初期グループに戻しますか？")) return;
  groups=cloneGroups(INITIAL_GROUPS);
  localStorage.removeItem(STORAGE_KEY);
  render();
  setStatus("初期グループに戻しました");
}

function makeDataObject(){
  return {candidates:BASE.candidates,prelimGroups:groups};
}

function download(name,text,type){
  const blob=new Blob([text],{type});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function exportJson(){
  download("sukigao9_data.json",JSON.stringify(makeDataObject()),"application/json");
}

function exportDataJs(){
  download("data.js","window.SUKIGAO9_DATA = "+JSON.stringify(makeDataObject())+";\n","text/javascript");
}

function importJson(){
  document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change",async e=>{
  const f=e.target.files[0];
  if(!f)return;
  try{
    const x=JSON.parse(await f.text());
    if(!x || !validGroups(x.prelimGroups) || !Array.isArray(x.candidates) || x.candidates.length!==100){
      throw new Error("形式が違います");
    }
    groups=x.prelimGroups.map(g=>g.map(Number));
    render();
    setStatus("読み込みました。保存を押すと反映されます");
  }catch(err){
    setStatus("読み込みに失敗しました",false);
  }
  e.target.value="";
});

document.getElementById("search").addEventListener("input",renderAll);

function esc(s){
  return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}

render();
</script>
</body>
</html>
