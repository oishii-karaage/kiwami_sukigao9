<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>好き顔9選</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f7f7f7;color:#222}
main{max-width:720px;margin:auto;padding:24px 16px 48px}h1{text-align:center;font-size:28px;margin:12px 0 8px}
p{line-height:1.6}.muted{color:#666;font-size:14px}.screen{display:none}.screen.active{display:block}
.progress{height:6px;background:#e5e5e5;border-radius:99px;overflow:hidden;margin:18px 0 24px}.progress>div{height:100%;background:#222;width:0}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:2px solid #ddd;border-radius:14px;padding:8px;cursor:pointer;user-select:none}.card.selected{border-color:#111;box-shadow:0 0 0 2px #111 inset}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#eee}.name{text-align:center;font-weight:700;padding:8px 2px 4px}
.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#222;color:#fff;flex:1}.btn.secondary{background:#e9e9e9;color:#222}.btn:disabled{opacity:.4;cursor:not-allowed}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px}.duel .card{padding:8px}.draw{display:block;width:100%;margin:16px 0 10px;background:#fff;color:#222;border:2px solid #ccc}.back{background:#eee;color:#222}
.rank{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rank .card{cursor:default;border:1px solid #ddd}.rank .place{text-align:center;font-weight:800;font-size:14px;padding-top:5px}
.top9{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 28px}.top9 .card{cursor:default}.top9 img{aspect-ratio:1}.top9 .place{font-weight:800;text-align:center;padding:5px}
@media(max-width:430px){main{padding:18px 12px}.top9,.rank{gap:7px}.name{font-size:14px}.btn{font-size:15px;padding:13px 10px}}
</style>
</head>
<body>
<main>
<section id="start" class="screen active">
<h1>好き顔9選</h1>
<p>100人の候補から予選で最大75人を選び、本戦で「好きな顔」を二択比較します。</p>
<p class="muted">現在は動作確認用の仮候補100人です。あとから名前と写真を差し替えられます。</p>
<button class="btn" onclick="startQual()">予選を始める</button>
</section>

<section id="qual" class="screen">
<h1>予選</h1><div class="muted" id="qualInfo"></div><div class="progress"><div id="qualBar"></div></div>
<div id="qualGrid" class="grid4"></div>
<div class="actions"><button class="btn secondary" id="qualBack" onclick="qualBack()">戻る</button><button class="btn" onclick="qualNext()">次へ</button></div>
</section>

<section id="qualDone" class="screen">
<h1>予選終了</h1><p id="qualDoneText"></p>
<button class="btn" onclick="startBattle()">本戦へ進む</button>
</section>

<section id="battle" class="screen">
<h1>本戦</h1><div class="muted" id="battleInfo"></div><div class="progress"><div id="battleBar"></div></div>
<div class="duel" id="duel"></div>
<button class="btn draw" onclick="answer('draw')">引き分け</button>
<button class="btn back" id="battleBack" onclick="battleBack()">← 戻る</button>
</section>

<section id="result" class="screen">
<h1>好き顔9選</h1><p class="muted">本戦の比較結果から算出した順位です。</p>
<div id="top9" class="top9"></div>
<h2>全順位</h2><div id="ranking" class="rank"></div>
<button class="btn" onclick="location.reload()">最初からやり直す</button>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
